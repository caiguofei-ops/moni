<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Moni Happy® Official | Global Website</title>
    <meta name="description" content="Welcome to the official global portal of Moni Happy®. The original brand for premium care. Recognized by our 3,500+ community members.">
    <link rel="canonical" href="https://monihappy.com">

    <link rel="preload" as="image" href="logo.webp" fetchpriority="high">

    <style>
        /* 采用极简设计语言，传达“大牌感” */
        :root { 
            --brand-blue: #228be6; 
            --brand-orange: #fab005; 
            --bg-color: #ffffff;
        }

        body, html { 
            height: 100%; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            background-color: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        /* 容器：垂直居中 */
        .brand-container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-in-out;
        }

        /* Logo 样式：自适应大小 */
        .main-logo {
            width: 280px;
            max-width: 80%;
            height: auto;
            margin-bottom: 2rem;
            /* 即使只有一张图，也要确保 LCP 极快 */
        }

        /* 身份标签：区分山寨站的关键 */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #f1f3f5;
            color: #495057;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid #dee2e6;
        }

        .tagline {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            color: #868e96;
            font-weight: 300;
        }

        /* 法律页脚：在底层宣告主权 */
        footer {
            position: absolute;
            bottom: 40px;
            text-align: center;
            font-size: 12px;
            color: #adb5bd;
            line-height: 1.6;
        }

        .official-link {
            color: var(--brand-blue);
            text-decoration: none;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Brand",
      "name": "Moni Happy",
      "url": "https://monihappy.com",
      "logo": "https://monihappy.com/logo.webp",
      "identifier": "YOUR_TRADEMARK_NUMBER",
      "sameAs": [
        "https://www.facebook.com/MoniHappyBabyDiaper"
      ],
      "description": "Moni Happy® is the authentic brand for premium baby and family care products."
    }
    </script>
</head>
<body>

    <div class="brand-container">
        <img src="logo.webp" alt="Moni Happy Official Logo" class="main-logo" fetchpriority="high">
        
        <br>
        
        <div class="badge">Verified Official Site</div>
        
        <div class="tagline">
            Excellence in Quality. Global Recognition.
        </div>
    </div>

    <footer>
        <p><strong>Moni Happy®</strong> is a registered trademark.</p>
        <p>Official Global Domain: <span class="official-link">monihappy.com</span></p>
        <p>&copy; 2026 Moni Happy Brand. All Rights Reserved.</p>
    </footer>

</body>
</html>
