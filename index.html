<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moni Happy® | Official Global Portal</title>
    <style>
        :root { --brand-blue: #228be6; }
        body, html { 
            height: 100%; margin: 0; 
            /* 使用柔和的渐变色，比纯白更有高级感 */
            background: radial-gradient(circle at center, #ffffff 0%, #f8f9fa 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); /* 毛玻璃效果 */
            padding: 50px;
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
        }

        .main-logo {
            width: 220px;
            /* 如果图片有格子底，我们直接给它一个白色的容器遮羞 */
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px #eee;
            margin-bottom: 30px;
        }

        .verified-badge {
            font-size: 12px;
            font-weight: bold;
            color: #34c759;
            background: rgba(52, 199, 89, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .domain-info {
            margin-top: 25px;
            font-size: 18px;
            font-weight: 600;
            color: var(--brand-blue);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div style="margin-bottom: 15px;"><span class="verified-badge">✓ Official Trademark Site</span></div>
        <img src="logo.webp" alt="Moni Happy" class="main-logo">
        <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Moni Happy®</div>
        <div class="domain-info">monihappy.com</div>
        <p style="color: #86868b; font-size: 14px; margin-top: 15px;">Pure Care. Pure Happiness.</p>
    </div>

    <footer style="position: absolute; bottom: 30px; font-size: 11px; color: #adb5bd; text-align: center;">
        © 2026 Moni Happy Brand. All Rights Reserved.
    </footer>

</body>
</html>
